<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subdomain Finder Pro</title>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161d;
    --panel-2: #181d26;
    --border: #232a35;
    --border-soft: #1b212a;
    --accent: #35d0a0;
    --accent-dim: #1f5b47;
    --accent-2: #4f9dff;
    --text: #e8edf2;
    --muted: #7c8894;
    --faint: #4c5561;
    --danger: #ff6767;
    --warn: #f5a742;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(53, 208, 160, 0.08), transparent);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 18px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* header */
  header { margin-bottom: 32px; }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-icon svg { width: 20px; height: 20px; stroke: #071310; }
  .brand-text h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .brand-text p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* card */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }

  .input-row { display: flex; gap: 10px; }
  .input-field {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-field svg {
    position: absolute;
    left: 14px;
    width: 16px; height: 16px;
    stroke: var(--faint);
    pointer-events: none;
  }
  input[type=text] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px 14px 13px 40px;
    border-radius: 11px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus { border-color: var(--accent-2); }
  input[type=text]::placeholder { color: var(--faint); }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #06140f;
    border: none;
    padding: 0 20px;
    border-radius: 11px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: opacity 0.15s, transform 0.1s;
  }
  button svg { width: 16px; height: 16px; stroke: #06140f; stroke-width: 2.4; }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* status */
  .status-box {
    display: none;
    text-align: center;
    padding: 34px 10px 30px;
    color: var(--muted);
  }
  .spinner-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .spinner {
    width: 30px; height: 30px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #statusText { font-size: 13.5px; }

  /* summary */
  .summary {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
    padding: 12px 14px;
    background: var(--panel-2);
    border-radius: 11px;
    border: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .summary svg { width: 15px; height: 15px; stroke: var(--accent); flex-shrink: 0; }
  .summary b { color: var(--text); font-weight: 600; }
  .summary .sep { color: var(--faint); }
  .summary .warn-line {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--warn);
    margin-top: 6px;
    font-size: 12.5px;
  }
  .summary .warn-line svg { stroke: var(--warn); width: 14px; height: 14px; }

  /* results */
  .results { display: flex; flex-direction: column; gap: 8px; }
  .result-item {
    background: var(--panel-2);
    border: 1px solid var(--border-soft);
    border-radius: 11px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    transition: border-color 0.15s;
  }
  .result-item:hover { border-color: var(--border); }
  .host-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .host-row svg { width: 15px; height: 15px; stroke: var(--accent); flex-shrink: 0; }
  .host {
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 13.5px;
    color: var(--text);
    word-break: break-all;
  }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge {
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 7px;
    background: #0e1a15;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    font-family: 'SF Mono', 'Consolas', monospace;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .badge svg { width: 11px; height: 11px; }
  .badge.neutral {
    color: var(--muted);
    background: #151a21;
    border-color: var(--border);
  }
  .badge.cf { color: var(--warn); background: #1c1509; border-color: #3d2c0f; }
  .badge.status-ok { color: var(--accent); background: #0e1a15; border-color: var(--accent-dim); }
  .badge.status-warn { color: var(--warn); background: #1c1509; border-color: #3d2c0f; }
  .badge.status-err { color: var(--danger); background: #1e0e0e; border-color: #422; }

  /* empty / error */
  .empty, .error {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 20px 18px;
    color: var(--muted);
    font-size: 13.5px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .empty svg { stroke: var(--muted); width: 18px; height: 18px; flex-shrink: 0; }
  .error { color: var(--danger); border-color: #3a1f1f; }
  .error svg { stroke: var(--danger); width: 18px; height: 18px; flex-shrink: 0; }

  /* pagination */
  .pagination {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding: 4px;
  }
  .page-btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 15px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .page-btn svg { stroke: var(--text); width: 14px; height: 14px; stroke-width: 2.4; }
  .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .page-info {
    font-size: 12.5px;
    color: var(--muted);
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
    color: var(--faint);
    font-size: 11.5px;
    margin-top: 34px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-row">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Subdomain Finder Pro</h1>
        <p>Cari &amp; cek status subdomain aktif dari sebuah domain</p>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="input-row">
      <div class="input-field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/>
        </svg>
        <input type="text" id="domainInput" placeholder="contoh: example.com" autocomplete="off">
      </div>
      <button id="scanBtn" onclick="startScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Scan
      </button>
    </div>
  </div>

  <div class="status-box" id="statusBox">
    <div class="spinner-wrap"><div class="spinner"></div></div>
    <div id="statusText">Memulai scan...</div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="error" id="errorBox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="errorText"></span>
  </div>

  <div class="empty" id="emptyBox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Tidak ada subdomain aktif yang merespon HTTP.</span>
  </div>

  <div class="results" id="results"></div>

  <div class="pagination" id="pagination">
    <button class="page-btn" id="prevBtn" onclick="goToPage(currentPage - 1)">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Prev
    </button>
    <span class="page-info" id="pageInfo"></span>
    <button class="page-btn" id="nextBtn" onclick="goToPage(currentPage + 1)">
      Next
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <footer>
    <span>Gunakan hanya pada domain milik sendiri atau target program bug bounty resmi.</span>
    <span>Data dari crt.sh &amp; hackertarget.com.</span>
    <span>Developer: joy tunneling</span>
  </footer>
</div>

<script>
const scanBtn = document.getElementById('scanBtn');
const domainInput = document.getElementById('domainInput');
const statusBox = document.getElementById('statusBox');
const statusText = document.getElementById('statusText');
const summary = document.getElementById('summary');
const errorBox = document.getElementById('errorBox');
const errorText = document.getElementById('errorText');
const emptyBox = document.getElementById('emptyBox');
const resultsEl = document.getElementById('results');
const pagination = document.getElementById('pagination');
const pageInfo = document.getElementById('pageInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const PAGE_SIZE = 10;
let allActive = [];
let currentPage = 0;

const ICONS = {
  globe: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/></svg>`,
  cloud: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.5A4.5 4.5 0 0 0 6.5 19h11Z"/></svg>`,
  home: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>`,
  server: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="1.5"/><rect x="2" y="14" width="20" height="7" rx="1.5"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  target: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
};

domainInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startScan();
});

function resetUI() {
  summary.style.display = 'none';
  errorBox.style.display = 'none';
  emptyBox.style.display = 'none';
  pagination.style.display = 'none';
  resultsEl.innerHTML = '';
  allActive = [];
  currentPage = 0;
}

function renderResultItem(item) {
  const div = document.createElement('div');
  div.className = 'result-item';
  div.innerHTML = `
    <div class="host-row">
      ${ICONS.check}
      <span class="host">${item.host}</span>
    </div>
    <div class="meta">
      <span class="badge neutral">${ICONS.globe}${item.ip}</span>
      <span class="badge ${item.cloudflare ? 'cf' : ''}">${item.cloudflare ? ICONS.cloud + 'CF' : ICONS.home + 'Direct'}</span>
      <span class="badge ${statusBadgeClass(item.status)}">${ICONS.server}${item.status}</span>
    </div>
  `;
  return div;
}

function goToPage(page) {
  const totalPages = Math.max(1, Math.ceil(allActive.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(0, page), totalPages - 1);

  resultsEl.innerHTML = '';
  const start = currentPage * PAGE_SIZE;
  const slice = allActive.slice(start, start + PAGE_SIZE);
  slice.forEach(item => resultsEl.appendChild(renderResultItem(item)));

  pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage >= totalPages - 1;
  pagination.style.display = totalPages > 1 ? 'flex' : 'none';

  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function statusBadgeClass(code) {
  if (code >= 200 && code < 300) return 'status-ok';
  if (code >= 300 && code < 400) return 'status-warn';
  return 'status-err';
}

async function startScan() {
  const domain = domainInput.value.trim().toLowerCase();
  if (!domain || !domain.includes('.')) {
    alert('Masukkan domain yang valid, contoh: example.com');
    return;
  }

  resetUI();
  scanBtn.disabled = true;
  statusBox.style.display = 'block';
  statusText.textContent = `Mengumpulkan subdomain untuk ${domain}...`;

  try {
    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ domain })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Terjadi kesalahan pada server');
    }

    statusBox.style.display = 'none';

    if (!data.active || data.active.length === 0) {
      emptyBox.style.display = 'flex';
    } else {
      summary.style.display = 'flex';
      summary.innerHTML = `
        ${ICONS.target}
        <span>Domain: <b>${data.domain}</b></span>
        <span class="sep">·</span>
        <span>Ditemukan: <b>${data.total_found}</b> host</span>
        <span class="sep">·</span>
        <span>Dicek: <b>${data.checked}</b></span>
        <span class="sep">·</span>
        <span>Aktif: <b>${data.active.length}</b></span>
        ${data.truncated ? `<div class="warn-line">${ICONS.alert}<span>Domain punya lebih dari 300 host, hanya 300 pertama yang dicek</span></div>` : ''}
      `;

      allActive = data.active;
      goToPage(0);
    }
  } catch (err) {
    statusBox.style.display = 'none';
    errorBox.style.display = 'flex';
    errorText.textContent = err.message;
  } finally {
    scanBtn.disabled = false;
  }
}
</script>
</body>
</html>
